<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tube Grab — YouTube Downloader</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="description" content="A beautiful, single-file YouTube downloader — Claude-inspired theme, Material 3 design.">
<meta name="theme-color" content="#cc785c">
<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="Tube Grab — YouTube Downloader">
<meta property="og:description" content="A beautiful, single-file YouTube downloader — Claude-inspired theme, Material 3 design.">
<meta property="og:url" content="https://wized2.github.io/tube-grab/">
<meta property="og:image" content="https://wized2.github.io/tube-grab/favicon.svg">
<meta property="og:site_name" content="Tube Grab">
<!-- Twitter -->
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Tube Grab — YouTube Downloader">
<meta name="twitter:description" content="A beautiful, single-file YouTube downloader — Claude-inspired theme, Material 3 design.">
<meta name="twitter:image" content="https://wized2.github.io/tube-grab/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0"></script>
<style>
  :root{
    --canvas:#faf9f5;--surface:#f0eee6;--surface-card:#efe9de;--ink:#141413;
    --olive:#5e5d59;--warm-dark:#3d3d3a;--coral:#cc785c;--coral-active:#a9583e;
    --coral-soft:rgba(204,120,92,.12);--hairline:#e8e6dc;--sage:#788c5d;
    --surface-dark:#181715;--on-dark:#faf9f5;--radius-sm:8px;--radius-md:12px;
    --radius-lg:16px;--shadow-1:0 1px 2px rgba(20,20,19,.04),0 4px 24px rgba(20,20,19,.05);
    --shadow-2:0 2px 8px rgba(20,20,19,.06),0 12px 32px rgba(20,20,19,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:'Lora',Georgia,serif;background:var(--canvas);color:var(--ink);line-height:1.6;display:flex;justify-content:center;padding:16px;min-height:100vh}
  .app{width:100%;max-width:480px;display:flex;flex-direction:column;gap:20px}
  .appbar{display:flex;align-items:center;gap:12px;padding:8px 4px 0}
  .appbar .logo{width:40px;height:40px;border-radius:var(--radius-md);background:var(--coral);display:grid;place-items:center;color:#fff;box-shadow:var(--shadow-1)}
  .appbar h1{font-family:'Poppins',sans-serif;font-weight:700;font-size:20px;letter-spacing:-.02em}
  .appbar .sub{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--olive)}
  .search-card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--radius-lg);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-1)}
  .input-wrap{display:flex;align-items:center;gap:10px;background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--radius-md);padding:0 12px;height:52px;transition:border-color .2s,box-shadow .2s}
  .input-wrap:focus-within{border-color:var(--coral);box-shadow:0 0 0 3px var(--coral-soft)}
  .input-wrap i{color:var(--olive);flex-shrink:0}
  .input-wrap input{flex:1;border:none;outline:none;background:transparent;font-family:'Lora',serif;font-size:15px;color:var(--ink);height:100%}
  .input-wrap input::placeholder{color:#a8a69d}
  .segmented{display:flex;background:var(--canvas);border:1px solid var(--hairline);border-radius:999px;padding:4px;gap:4px}
  .segmented button{flex:1;border:none;background:transparent;padding:9px 12px;border-radius:999px;font-family:'Poppins',sans-serif;font-weight:600;font-size:13px;color:var(--olive);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s cubic-bezier(.2,0,0,1)}
  .segmented button.active{background:var(--coral);color:#fff;box-shadow:0 2px 6px rgba(204,120,92,.3)}
  .segmented button i{width:16px;height:16px}
  .btn-primary{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border:none;border-radius:var(--radius-md);background:var(--coral);color:#fff;font-family:'Poppins',sans-serif;font-weight:600;font-size:15px;cursor:pointer;transition:background .2s,transform .1s;box-shadow:var(--shadow-1)}
  .btn-primary:active{background:var(--coral-active);transform:scale(.98)}
  .btn-primary:disabled{opacity:.55;cursor:not-allowed}
  .status{display:none;align-items:center;gap:8px;padding:12px 14px;border-radius:var(--radius-md);font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.02em}
  .status.show{display:flex}
  .status.error{background:#f7e7e2;color:#a9583e;border:1px solid #e8d0c8}
  .status.info{background:#eef2f7;color:#3d5a7a;border:1px solid #d6e0eb}
  .result{display:none;background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-2);animation:rise .35s cubic-bezier(.2,0,0,1)}
  .result.show{display:block}
  @keyframes rise{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
  .result-thumb{position:relative;aspect-ratio:16/9;background:var(--surface-card);overflow:hidden}
  .result-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .result-thumb .duration-badge{position:absolute;bottom:10px;right:10px;background:rgba(20,20,19,.78);color:#fff;font-family:'JetBrains Mono',monospace;font-size:11px;padding:3px 8px;border-radius:6px;backdrop-filter:blur(4px)}
  .result-body{padding:16px;display:flex;flex-direction:column;gap:12px}
  .result-title{font-family:'Poppins',sans-serif;font-weight:600;font-size:16px;line-height:1.35;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .result-meta{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--olive);text-transform:uppercase;letter-spacing:.05em}
  .result-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--olive)}
  .btn-download{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border:none;border-radius:var(--radius-sm);background:var(--surface-dark);color:var(--on-dark);font-family:'Poppins',sans-serif;font-weight:600;font-size:14px;cursor:pointer;transition:transform .1s,background .2s}
  .btn-download:active{transform:scale(.98);background:#000}
  .footer{text-align:center;font-family:'JetBrains Mono',monospace;font-size:10px;color:#b0aea5;letter-spacing:.06em;text-transform:uppercase;padding:8px 0 24px}
  .spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
  <header class="appbar">
    <div class="logo"><i data-lucide="youtube" style="width:22px;height:22px"></i></div>
    <div>
      <h1>Tube Grab</h1>
      <div class="sub">Manew · powered by you-tube-dl-psi</div>
    </div>
  </header>

  <section class="search-card">
    <div class="input-wrap">
      <i data-lucide="link" style="width:20px;height:20px"></i>
      <input id="query" type="text" placeholder="Paste a YouTube link or search…" autocomplete="off" spellcheck="false">
    </div>
    <div class="segmented" role="tablist">
      <button id="fmtAudio" class="active" role="tab"><i data-lucide="music"></i> Audio</button>
      <button id="fmtVideo" role="tab"><i data-lucide="video"></i> Video</button>
    </div>
    <button id="searchBtn" class="btn-primary">
      <i data-lucide="search" style="width:18px;height:18px"></i>
      <span>Fetch Info</span>
    </button>
  </section>

  <div id="status" class="status"></div>

  <article id="result" class="result">
    <div class="result-thumb">
      <img id="thumb" alt="Thumbnail">
      <span class="duration-badge" id="duration">0:00</span>
    </div>
    <div class="result-body">
      <h2 class="result-title" id="title">—</h2>
      <div class="result-meta">
        <i data-lucide="clock" style="width:13px;height:13px"></i>
        <span id="metaDuration">—</span>
        <span class="dot"></span>
        <span id="metaFormat">audio</span>
      </div>
      <button class="btn-download" id="downloadBtn">
        <i data-lucide="download" style="width:18px;height:18px"></i>
        <span>Download</span>
      </button>
    </div>
  </article>

  <footer class="footer">Only download content you have rights to</footer>
</div>

<script>
const API_BASE = 'https://you-tube-dl-psi.vercel.app';
let currentFormat = 'audio';
let currentInfo = null;
const $ = (id) => document.getElementById(id);

function setStatus(msg, kind = 'info') {
  const el = $('status');
  el.textContent = msg;
  el.className = 'status show ' + kind;
}
function clearStatus() { $('status').className = 'status'; }

function fmtDuration(sec) {
  if (!sec && sec !== 0) return '—';
  const s = Math.round(Number(sec));
  const m = Math.floor(s / 60), r = s % 60;
  return `${m}:${String(r).padStart(2,'0')}`;
}

$('fmtAudio').addEventListener('click', () => {
  currentFormat = 'audio';
  $('fmtAudio').classList.add('active');
  $('fmtVideo').classList.remove('active');
  if (currentInfo) loadResult(currentInfo);
});
$('fmtVideo').addEventListener('click', () => {
  currentFormat = 'video';
  $('fmtVideo').classList.add('active');
  $('fmtAudio').classList.remove('active');
  if (currentInfo) loadResult(currentInfo);
});

function loadResult(data) {
  const info = data.ytdl || data;
  $('title').textContent = info.title || 'Unknown title';
  $('thumb').src = info.thumbnail || '';
  const dur = fmtDuration(info.duration);
  $('duration').textContent = dur;
  $('metaDuration').textContent = dur;
  $('metaFormat').textContent = currentFormat;
  $('result').classList.add('show');
  currentInfo = data;
}

async function fetchInfo() {
  const q = $('query').value.trim();
  if (!q) { setStatus('Enter a link or search term first.', 'error'); return; }
  clearStatus();
  $('result').classList.remove('show');
  const btn = $('searchBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span><span>Fetching…</span>';
  try {
    const url = `${API_BASE}/youtube?url=${encodeURIComponent(q)}&format=${currentFormat}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`API HTTP ${res.status}`);
    const json = await res.json();
    if (!json || !json.status || !json.data) throw new Error('API returned no data');
    loadResult(json.data);
    setStatus('Info fetched. Tap Download to save.', 'info');
  } catch (e) {
    setStatus('Failed: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i data-lucide="search" style="width:18px;height:18px"></i><span>Fetch Info</span>';
    if (window.lucide) lucide.createIcons();
  }
}

$('searchBtn').addEventListener('click', fetchInfo);
$('query').addEventListener('keydown', (e) => { if (e.key === 'Enter') fetchInfo(); });

$('downloadBtn').addEventListener('click', async () => {
  if (!currentInfo || !currentInfo.ytdl || !currentInfo.ytdl.download) {
    setStatus('No download link available. Fetch info first.', 'error'); return;
  }
  const dl = currentInfo.ytdl.download;
  const proxy = `${API_BASE}/youtube/download?url=${encodeURIComponent(dl)}`;
  const btn = $('downloadBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner" style="border-color:rgba(255,255,255,.35);border-top-color:#fff"></span><span>Preparing…</span>';
  setStatus('Opening download…', 'info');
  try {
    const a = document.createElement('a');
    a.href = proxy;
    a.target = '_blank';
    a.rel = 'noopener';
    a.download = '';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setStatus('Download started in a new tab. Long videos may take a moment.', 'info');
  } catch (e) {
    setStatus('Download failed: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i data-lucide="download" style="width:18px;height:18px"></i><span>Download</span>';
    if (window.lucide) lucide.createIcons();
  }
});

lucide.createIcons();
</script>
</body>
</html>
